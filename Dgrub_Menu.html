        .item-name {

        .item-price {

        }
        .action-button {
            /* General button styling, now with stronger shadows and accessibility focus rings */
            @apply px-4 py-2 rounded-full font-medium text-sm transition-transform transform hover:scale-105 shadow-lg
                   focus:outline-none focus:ring-2 focus:ring-offset-2;
        }
        .description-button {

        }
        .pairing-button {
            /* Specific styling for the Pairing button with a red gradient */
            @apply bg-gradient-to-r from-green-600 to-green-700 text-white;
        }
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fefefe;
            padding: 24px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .close-button {
            color: #aaa;
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            font-weight: bold;
        }
        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

            if (!acc[subgroup]) {

            }
            acc[subgroup].push(item);
            return acc;
        }, {});

        const menuContentDiv = document.getElementById('menu-content');

        const modalBody = document.getElementById('modal-body');

        // Close the modal when the user clicks on 'x'
        closeBtn.onclick = function() {
            modal.style.display = 'none';
        }

        // Close the modal when the user clicks anywhere outside of it
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Function to make a Gemini API call and handle the response
        async function callGeminiAPI(prompt) {
            modal.style.display = 'flex';
            modalTitle.textContent = "Loading...";
            modalBody.innerHTML = '<div class="loader"></div>';

            try {
                const chatHistory = [];
                chatHistory.push({ role: "user", parts: [{ text: prompt }] });
                const payload = { contents: chatHistory };
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

                let response = null;
                let retryCount = 0;
                const maxRetries = 5;
                const baseDelay = 1000;

                // Implement exponential backoff for API calls
                while (retryCount < maxRetries) {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        break;
                    }

                    if (response.status === 429) {
                        const delay = baseDelay * Math.pow(2, retryCount);
                        await new Promise(resolve => setTimeout(resolve, delay));
                        retryCount++;
                    } else {
                        throw new Error(`API call failed with status: ${response.status}`);
                    }
                }

                if (!response || !response.ok) {
                    throw new Error("API call failed after multiple retries.");
                }

                const result = await response.json();
                const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!text) {
                    throw new Error("No text found in API response.");
                }
                modalBody.textContent = text;
            } catch (error) {
                console.error("Gemini API Error:", error);
                modalBody.textContent = 'Sorry, something went wrong. Please try again later.';
            }
        }

        // Function to handle the "Get Description" button click
        function getDescription(itemName) {
            modalTitle.textContent = `Description for ${itemName}`;
            const prompt = `Write a short, appetizing food description for "${itemName}". Use a friendly tone. Mention key flavors and textures. Do not include any formatting like bullet points or bold text.`;
            callGeminiAPI(prompt);
        }

        // Function to handle the "Get Pairing" button click
        function getPairing(itemName) {
            modalTitle.textContent = `Pairing Suggestions for ${itemName}`;
            const allItems = menuData.map(item => item.Name).join(", ");
            const prompt = `Suggest a complementary food pairing from the D'GRUB menu for the dish "${itemName}". The menu items are: ${allItems}. Give a reason why it's a good pairing. Format the output with the suggestion first, then a short reason.`;
            callGeminiAPI(prompt);
        }

        // Function to create a section for each menu category
        function createMenuCategory(categoryName, items) {
            const categoryDiv = document.createElement('div');
            categoryDiv.className = 'menu-category';

            const title = document.createElement('h2');
            title.className = 'menu-category-title';
            title.textContent = categoryName;
            categoryDiv.appendChild(title);

            // Grid layout for menu items within each category
            // `grid-cols-1` is for mobile, `md:grid-cols-2` is for medium screens and up
            const itemsGrid = document.createElement('div');
            itemsGrid.className = 'grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-8';

            items.forEach(item => {
                const itemDiv = document.createElement('div');
                // `flex-col` is for mobile, `md:flex-row` is for medium screens and up
                itemDiv.className = 'flex flex-col md:flex-row justify-between items-start md:items-center p-5 border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition-shadow duration-300';
                
                // Container for the item name and description button
                const itemDetails = document.createElement('div');
                itemDetails.className = 'flex flex-col items-start w-full md:w-auto mb-2 md:mb-0';

                const itemName = document.createElement('p');
                itemName.className = 'item-name text-lg mb-2'; // Added margin-bottom
                itemName.textContent = item.Name;
                itemDetails.appendChild(itemName);

                // Create the box for the Description button
                const descriptionBox = document.createElement('div');
                // Removed w-full to make it smaller, and set margin-top
                descriptionBox.className = 'bg-red-100 p-1 rounded-lg shadow-sm mt-2';
                const descriptionButton = document.createElement('button');
                descriptionButton.className = 'action-button description-button';
                descriptionButton.textContent = 'Get Description';
                descriptionButton.onclick = () => getDescription(item.Name);
                descriptionBox.appendChild(descriptionButton);
                itemDetails.appendChild(descriptionBox);

                itemDiv.appendChild(itemDetails);

                // Container for the pairing button and price
                const rightSide = document.createElement('div');
                // `flex-col` on mobile, `flex-row` on medium screens
                rightSide.className = 'flex flex-col md:flex-row items-end md:items-center mt-2 md:mt-0 md:ml-auto space-y-2 md:space-y-0 md:space-x-4';

                // Create the box for the Pairing button
                const pairingBox = document.createElement('div');
                pairingBox.className = 'bg-red-100 p-2 rounded-lg shadow-sm';
                const pairingButton = document.createElement('button');
                // `w-full` on mobile to make it fill the space
                pairingButton.className = 'action-button pairing-button w-full';
                pairingButton.textContent = 'Get Pairing';
                pairingButton.onclick = () => getPairing(item.Name);
                pairingBox.appendChild(pairingButton);
                rightSide.appendChild(pairingBox);

                const itemPrice = document.createElement('div');
                itemPrice.className = 'item-price text-right text-lg mt-2 md:mt-0';

                // Check for a price value
                if (item.Price) {
                    itemPrice.textContent = `₹${item.Price}`;
                } else {
                    itemPrice.textContent = `Price on request`;
                    itemPrice.className = 'text-gray-500 italic';
                }
                rightSide.appendChild(itemPrice);
                itemDiv.appendChild(rightSide);

                itemsGrid.appendChild(itemDiv);
            });

            categoryDiv.appendChild(itemsGrid);
            menuContentDiv.appendChild(categoryDiv);
        }

        // Render the menu by iterating through the grouped data
        for (const category in groupedMenu) {
            if (Object.hasOwnProperty.call(groupedMenu, category)) {
                createMenuCategory(category, groupedMenu[category]);
            }
